name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Libs système requises par PySide6 en mode offscreen (pas de serveur X).
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e '.[dev]'
      - run: ruff check cochwa tests tools && ruff format --check cochwa tests tools
      - run: python -m unittest discover -s tests -v
      - run: QT_QPA_PLATFORM=offscreen python -m pytest tests/gui -v
      - run: python -m build
