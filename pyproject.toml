[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cochwa"
version = "0.2.0"
description = "Cochwa — bibliothèque de ROMs, transferts vérifiés et intégration PCSX2 / Steam ROM Manager"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "lucas" }]
dependencies = ["requests>=2.31,<3", "Pillow>=10,<13", "PySide6>=6.6", "tomli-w>=1.0,<2"]

[project.optional-dependencies]
dev = ["ruff==0.15.6", "build>=1,<2", "pytest>=8,<10", "pytest-qt>=4.4,<5"]

[project.scripts]
cochwa = "cochwa.cli:main"
cochwa-gui = "cochwa.gui_qt.app:main"
# Alias historiques : les wrappers ~/.local/bin/romget* continuent de fonctionner.
romget = "cochwa.cli:main"
romget-gui = "cochwa.gui_qt.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cochwa*"]

[tool.setuptools.package-data]
"cochwa.data" = ["*.json"]
"cochwa.gui_qt" = ["assets/*.ttf", "assets/OFL.txt", "assets/*.svg"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["audit", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
